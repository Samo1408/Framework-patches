name: Build Android 14 framework.jar

on:
  workflow_dispatch:
    inputs:
      framework_url:
        description: 'Direct URL to the exact original Android 14 framework.jar'
        required: true
        type: string
      sha256:
        description: 'Optional SHA-256 of framework.jar; leave empty to skip'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout patch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download smali tools
        run: |
          mkdir -p tools
          curl -fL --retry 3 -o tools/baksmali-3.0.9-fat.jar \
            https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat-release.jar
          curl -fL --retry 3 -o tools/smali-3.0.9-fat.jar \
            https://github.com/baksmali/smali/releases/download/3.0.9/smali-3.0.9-fat-release.jar

      - name: Download original framework.jar
        env:
          FRAMEWORK_URL: ${{ inputs.framework_url }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          curl -fL --retry 3 -o framework.jar "$FRAMEWORK_URL"
          if [ -n "$EXPECTED_SHA256" ]; then
            echo "$EXPECTED_SHA256  framework.jar" | sha256sum -c -
          fi
          unzip -t framework.jar >/dev/null
          unzip -l framework.jar | grep -E 'classes[0-9]*\.dex$'

      - name: Build patched framework.jar
        run: |
          API=34 ./tools/build_framework.sh framework.jar framework_A14_sim-cached_patched.jar

      - name: Verify output structure
        run: |
          unzip -t framework_A14_sim-cached_patched.jar >/dev/null
          echo '--- DEX files ---'
          unzip -l framework_A14_sim-cached_patched.jar | grep -E 'classes[0-9]*\.dex$'
          echo '--- Spoof reference/class presence in assembled source tree ---'
          grep -R 'Landroid/location/Spoof;' patches

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-A14-sim-cached-patched
          path: framework_A14_sim-cached_patched.jar
          if-no-files-found: error
