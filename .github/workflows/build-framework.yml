name: Build Android 14 framework.jar

on:
  workflow_dispatch:
    inputs:
      framework_url:
        description: 'Direct URL to the exact original Android 14 framework.jar'
        required: true
        type: string
      sha256:
        description: 'Optional SHA-256 of framework.jar; leave empty to skip'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout patch
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download smali tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 --retry-all-errors -o tools/baksmali-3.0.10-fat.jar \
            https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar
          curl -fL --retry 3 --retry-all-errors -o tools/smali-3.0.10-fat.jar \
            https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar
          test -s tools/baksmali-3.0.10-fat.jar
          test -s tools/smali-3.0.10-fat.jar

      - name: Download original framework.jar
        env:
          FRAMEWORK_URL: ${{ inputs.framework_url }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors -o framework.jar "$FRAMEWORK_URL"

          if [ -n "$EXPECTED_SHA256" ]; then
            echo "$EXPECTED_SHA256  framework.jar" | sha256sum -c -
          fi

          unzip -t framework.jar >/dev/null
          echo '--- Original DEX files ---'
          unzip -l framework.jar | grep -E 'classes[0-9]*\.dex$'

          ORIGINAL_DEX_COUNT=$(unzip -Z1 framework.jar | grep -E '^classes[0-9]*\.dex$' | wc -l)
          test "$ORIGINAL_DEX_COUNT" -ge 1
          echo "Original DEX count: $ORIGINAL_DEX_COUNT (universal mode)"

      - name: Fix build script permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 tools/build_framework.sh
          test -x tools/build_framework.sh
          ls -l tools/build_framework.sh

      - name: Build patched framework.jar
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-debug
          mkdir -p build-debug
          API=34 SMALI_XMX=6g WORK_DIR="$GITHUB_WORKSPACE/build-debug" bash tools/build_framework.sh \
            framework.jar \
            framework_A14_universal_sim-cached_patched.jar

      - name: Verify output structure and critical classes
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT=framework_A14_universal_sim-cached_patched.jar
          test -s "$OUTPUT"
          unzip -t "$OUTPUT" >/dev/null

          echo '--- Output DEX files ---'
          unzip -l "$OUTPUT" | grep -E 'classes[0-9]*\.dex$'

          ORIGINAL_DEX_COUNT=$(unzip -Z1 framework.jar | grep -E '^classes[0-9]*\.dex$' | wc -l)
          OUTPUT_DEX_COUNT=$(unzip -Z1 "$OUTPUT" | grep -E '^classes[0-9]*\.dex$' | wc -l)
          echo "Original DEX count: $ORIGINAL_DEX_COUNT"
          echo "Output DEX count:   $OUTPUT_DEX_COUNT"
          test "$ORIGINAL_DEX_COUNT" -eq "$OUTPUT_DEX_COUNT"

          rm -rf verify_original verify_output
          mkdir -p verify_original verify_output
          unzip -q framework.jar -d verify_original
          unzip -q "$OUTPUT" -d verify_output

          echo '--- DEX names ---'
          diff -u \
            <(find verify_original -maxdepth 1 -type f -name 'classes*.dex' -printf '%f\n' | sort -V) \
            <(find verify_output   -maxdepth 1 -type f -name 'classes*.dex' -printf '%f\n' | sort -V)

          echo '--- Disassemble output for class verification ---'
          mkdir -p verify_smali
          for dex in verify_output/classes*.dex; do
            name=$(basename "$dex" .dex)
            mkdir -p "verify_smali/$name"
            java -jar tools/baksmali-3.0.10-fat.jar disassemble \
              --api 34 \
              --output "verify_smali/$name" \
              "$dex"
          done

          echo '--- Critical class checks ---'
          find verify_smali -type f -name 'RuntimeInit.smali' -path '*/com/android/internal/os/*' -print -quit | grep -q .
          find verify_smali -type f -name 'ZygoteInit.smali' -path '*/com/android/internal/os/*' -print -quit | grep -q .
          find verify_smali -type f -name 'Spoof.smali' -path '*/android/location/*' -print -quit | grep -q .

          echo 'RuntimeInit: OK'
          echo 'ZygoteInit:  OK'
          echo 'Spoof:       OK'

          echo '--- Patched class checks ---'
          for cls in \
            android/location/Country.smali \
            android/location/Location.smali \
            android/telephony/SubscriptionInfo.smali \
            android/telephony/TelephonyManager.smali; do
            find verify_smali -type f -path "*/$cls" -print -quit | grep -q .
            echo "$cls: OK"
          done

          echo '--- Jumbo normalization ---'
          grep -R -n 'const-string/jumbo' build-debug/dex/classes2 build-debug/dex/classes3 | head -10 || true

          echo '--- Universal helper references ---'
          grep -R -l 'Landroid/location/Spoof;' verify_smali | head -20
          grep -R -l 'Landroid/os/BuildSpoof;' verify_smali | head -20

          echo '--- No fixed DEX placement assumptions ---'
          ! grep -R -nE 'classes3\.dex|classes6\.dex' tools/build_framework.sh tools/universal_patch.py

          echo '--- Signature files ---'
          if unzip -Z1 "$OUTPUT" | grep -E '^META-INF/.*\.(SF|RSA|DSA)$' >/dev/null; then
            echo 'ERROR: stale JAR signature files found in output'
            exit 1
          fi

          echo 'Verification completed successfully.'

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-A14-build-diagnostics
          path: build-debug
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-A14-universal-sim-cached-patched
          path: framework_A14_universal_sim-cached_patched.jar
          if-no-files-found: error
